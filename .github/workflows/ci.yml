name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ZenUI.Wpf.slnx

      - name: Build
        run: dotnet build ZenUI.Wpf.slnx -c Release --no-restore

      - name: Pack
        shell: pwsh
        run: |
          $packageOutput = Join-Path $env:RUNNER_TEMP "nuget-packages"
          dotnet pack src/ZenUI.Wpf/ZenUI.Wpf.csproj -c Release --no-build -p:PackageVersion=0.1.0-ci.${{ github.run_number }} -o $packageOutput
          dotnet pack src/ZenUI.Wpf.Converters/ZenUI.Wpf.Converters.csproj -c Release --no-build -p:PackageVersion=0.1.0-ci.${{ github.run_number }} -o $packageOutput

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ${{ runner.temp }}/nuget-packages/*.nupkg
            ${{ runner.temp }}/nuget-packages/*.snupkg
          if-no-files-found: error

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net462
          - net47
          - net471
          - net472
          - net48
          - net481
          - net8.0-windows
          - net9.0-windows
          - net10.0-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ZenUI.Wpf.slnx

      - name: Test controls
        run: dotnet test --project tests/ZenUI.Wpf.Tests/ZenUI.Wpf.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --max-parallel-test-modules 1 --no-restore

      - name: Test converters
        run: dotnet test --project tests/ZenUI.Wpf.Converters.Tests/ZenUI.Wpf.Converters.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --max-parallel-test-modules 1 --no-restore

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-snapshots-${{ matrix.framework }}
          path: tests/ZenUI.Wpf.Tests/bin/Release/${{ matrix.framework }}/visual-regression/**/*.png
          if-no-files-found: error

  modern-compatibility-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net5.0-windows
            sdk: 5.0.x
          - framework: net6.0-windows
            sdk: 6.0.x
          - framework: net7.0-windows
            sdk: 7.0.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup current .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup compatibility runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Run compatibility smoke test
        run: dotnet run --project tests/ZenUI.Wpf.ModernCompatibilityTests/ZenUI.Wpf.ModernCompatibilityTests.csproj --configuration Release --framework ${{ matrix.framework }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-test-pack
      - test
      - modern-compatibility-test
    runs-on: windows-latest
    environment: 生产环境
    concurrency:
      group: nuget-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Resolve release packages
        id: release
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$') {
            throw "Invalid release tag: ${{ github.ref_name }}"
          }

          $projects = [ordered]@{
            'ZenUI.Wpf' = 'src/ZenUI.Wpf/ZenUI.Wpf.csproj'
            'ZenUI.Wpf.Converters' = 'src/ZenUI.Wpf.Converters/ZenUI.Wpf.Converters.csproj'
          }
          $packages = foreach ($entry in $projects.GetEnumerator()) {
            [xml]$project = Get-Content -LiteralPath $entry.Value -Raw
            $versionGroup = $project.Project.PropertyGroup |
              Where-Object { $_.VersionPrefix } |
              Select-Object -First 1
            $projectVersion = [string]$versionGroup.VersionPrefix
            if (-not [string]::IsNullOrWhiteSpace([string]$versionGroup.VersionSuffix)) {
              $projectVersion += "-$($versionGroup.VersionSuffix)"
            }

            if ($projectVersion -eq $version) {
              $entry.Key
            }
          }

          if (@($packages).Count -eq 0) {
            throw "No package version matches release tag ${{ github.ref_name }}."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "packages=$($packages -join ',')" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"
          Write-Host "Packages: $($packages -join ', ')"

      - name: Build verified release packages
        shell: pwsh
        run: |
          $packages = '${{ steps.release.outputs.packages }}' -split ','
          ./scripts/pack-release.ps1 `
            -Version '${{ steps.release.outputs.version }}' `
            -Package $packages

      - name: Upload verified release packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-release-${{ steps.release.outputs.version }}
          path: artifacts/releases/${{ steps.release.outputs.version }}/*
          if-no-files-found: error

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push `
            "artifacts/releases/${{ steps.release.outputs.version }}/*.nupkg" `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $tag = '${{ github.ref_name }}'
          $files = Get-ChildItem -LiteralPath "artifacts/releases/$version" -File |
            Select-Object -ExpandProperty FullName

          if (gh release view $tag 2>$null) {
            gh release upload $tag $files --clobber
            exit $LASTEXITCODE
          }

          $arguments = @(
            'release', 'create', $tag,
            '--verify-tag',
            '--title', "ZenUI WPF $version",
            '--generate-notes'
          )
          if ($version.Contains('-')) {
            $arguments += '--prerelease'
          }
          $arguments += $files

          gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
