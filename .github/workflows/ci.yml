name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ZenUI.Wpf.slnx

      - name: Build
        run: dotnet build ZenUI.Wpf.slnx -c Release --no-restore

      - name: Scan vulnerable dependencies
        shell: pwsh
        run: |
          $vulnerabilityJson = dotnet list ZenUI.Wpf.slnx package `
            --vulnerable `
            --include-transitive `
            --format json `
            --no-restore
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet list package exited with code $LASTEXITCODE."
          }

          $report = ($vulnerabilityJson -join [Environment]::NewLine) | ConvertFrom-Json
          $vulnerablePackages = foreach ($project in $report.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if (@($package.vulnerabilities).Count -gt 0) {
                  "$($package.id) $($package.resolvedVersion)"
                }
              }
            }
          }
          if (@($vulnerablePackages).Count -gt 0) {
            throw "Vulnerable packages found: $($vulnerablePackages -join ', ')."
          }

      - name: Pack
        shell: pwsh
        run: |
          $packageOutput = Join-Path $env:RUNNER_TEMP "nuget-packages"
          dotnet pack src/ZenUI.Wpf/ZenUI.Wpf.csproj -c Release --no-build -p:PackageVersion=0.1.0-ci.${{ github.run_number }} -o $packageOutput
          dotnet pack src/ZenUI.Wpf.Converters/ZenUI.Wpf.Converters.csproj -c Release --no-build -p:PackageVersion=0.1.0-ci.${{ github.run_number }} -o $packageOutput

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ${{ runner.temp }}/nuget-packages/*.nupkg
            ${{ runner.temp }}/nuget-packages/*.snupkg
          if-no-files-found: error

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net462
          - net47
          - net471
          - net472
          - net48
          - net481
          - net8.0-windows
          - net9.0-windows
          - net10.0-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ZenUI.Wpf.slnx

      - name: Test controls
        run: dotnet test --project tests/ZenUI.Wpf.Tests/ZenUI.Wpf.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --max-parallel-test-modules 1 --no-restore

      - name: Test converters
        run: dotnet test --project tests/ZenUI.Wpf.Converters.Tests/ZenUI.Wpf.Converters.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --max-parallel-test-modules 1 --no-restore

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-snapshots-${{ matrix.framework }}
          path: tests/ZenUI.Wpf.Tests/bin/Release/${{ matrix.framework }}/visual-regression/**/*.png
          if-no-files-found: error

  modern-compatibility-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net5.0-windows
            sdk: 5.0.x
          - framework: net6.0-windows
            sdk: 6.0.x
          - framework: net7.0-windows
            sdk: 7.0.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup current .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup compatibility runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Run compatibility contract tests
        run: dotnet run --project tests/ZenUI.Wpf.ModernCompatibilityTests/ZenUI.Wpf.ModernCompatibilityTests.csproj --configuration Release --framework ${{ matrix.framework }}
