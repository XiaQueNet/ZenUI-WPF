name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: windows-latest
    environment: 生产环境
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup compatibility runtimes
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            5.0.x
            6.0.x
            7.0.x

      - name: Resolve release packages
        id: release
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$') {
            throw "Invalid release tag: ${{ github.ref_name }}"
          }

          $projects = [ordered]@{
            'ZenUI.Wpf' = 'src/ZenUI.Wpf/ZenUI.Wpf.csproj'
            'ZenUI.Wpf.Converters' = 'src/ZenUI.Wpf.Converters/ZenUI.Wpf.Converters.csproj'
          }
          $packages = foreach ($entry in $projects.GetEnumerator()) {
            [xml]$project = Get-Content -LiteralPath $entry.Value -Raw
            $versionGroup = $project.Project.PropertyGroup |
              Where-Object { $_.VersionPrefix } |
              Select-Object -First 1
            $projectVersion = [string]$versionGroup.VersionPrefix
            if (-not [string]::IsNullOrWhiteSpace([string]$versionGroup.VersionSuffix)) {
              $projectVersion += "-$($versionGroup.VersionSuffix)"
            }

            if ($projectVersion -eq $version) {
              $entry.Key
            }
          }

          if (@($packages).Count -eq 0) {
            throw "No package version matches release tag ${{ github.ref_name }}."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "packages=$($packages -join ',')" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"
          Write-Host "Packages: $($packages -join ', ')"

      - name: Build verified release packages
        shell: pwsh
        run: |
          $packages = '${{ steps.release.outputs.packages }}' -split ','
          ./scripts/pack-release.ps1 `
            -Version '${{ steps.release.outputs.version }}' `
            -Package $packages

      - name: Upload verified release packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-release-${{ steps.release.outputs.version }}
          path: artifacts/releases/${{ steps.release.outputs.version }}/*
          if-no-files-found: error

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem `
            -LiteralPath "artifacts/releases/${{ steps.release.outputs.version }}" `
            -Filter '*.nupkg' `
            -File
          if ($packages.Count -eq 0) {
            throw "No NuGet packages were found for publication."
          }

          foreach ($package in $packages) {
            dotnet nuget push `
              $package.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish $($package.Name)."
            }
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $tag = '${{ github.ref_name }}'
          $files = Get-ChildItem -LiteralPath "artifacts/releases/$version" -File |
            Select-Object -ExpandProperty FullName

          if (gh release view $tag 2>$null) {
            gh release upload $tag $files --clobber
            exit $LASTEXITCODE
          }

          $arguments = @(
            'release', 'create', $tag,
            '--verify-tag',
            '--title', "ZenUI WPF $version",
            '--generate-notes'
          )
          if ($version.Contains('-')) {
            $arguments += '--prerelease'
          }
          $arguments += $files

          gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
